name: Check pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python engine.py build --catalog examples/rendered/catalog.json --pack-root examples/rendered --legacy legacy/manifest.json --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-preview
          path: dist/
          retention-days: 7
